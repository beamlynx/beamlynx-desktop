name: Supabase migrations

# Applies new migrations to the live Supabase database (supabase/README.md).
# Runs on every merge to main that changes a migration, and as the first job
# of every release (release.yml), so the database is always ahead of any app
# that needs it. Migrations only add, so applying them never breaks an app
# that is already released.
#
# Needs the repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and
# SUPABASE_DB_PASSWORD. Until they exist, it skips itself with a notice.

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_PROJECT_REF:
        required: false
      SUPABASE_DB_PASSWORD:
        required: false

# Never two at once: a release and a merge could both push.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets are not set, so no migrations were applied. See supabase/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Apply new migrations
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx -y supabase@2.120.0 link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx -y supabase@2.120.0 db push --password "$SUPABASE_DB_PASSWORD" --yes
