name: Release

# Builds and packages beamlynx-desktop for Linux, macOS, and Windows.
# Unsigned for now (code signing/notarization is a separate, later
# milestone) -- installers will show Gatekeeper/SmartScreen warnings until
# then. Triggered by a plain semver tag (matching pine-lang/beamlynx-ui's own
# tag convention -- no prefix needed, since each lives in its own repo with
# its own tag namespace) or manually via workflow_dispatch for test runs.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  read-pins:
    runs-on: ubuntu-latest
    outputs:
      pine_ref: ${{ steps.pins.outputs.pine_ref }}
      ui_ref: ${{ steps.pins.outputs.ui_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: |
          echo "pine_ref=$(jq -r .pineLangRef bundled-versions.json)" >> "$GITHUB_OUTPUT"
          echo "ui_ref=$(jq -r .beamlynxUiRef bundled-versions.json)" >> "$GITHUB_OUTPUT"

  build-jar:
    needs: read-pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: beamlynx/pine-lang
          ref: ${{ needs.read-pins.outputs.pine_ref }}
          path: pine-lang

      - name: Read pinned JDK version
        id: jdk
        run: echo "version=$(grep -v '^#' pine-lang/desktop/JDK_VERSION | grep -v '^\s*$')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - uses: DeLaGuardo/setup-clojure@11.0
        with:
          cli: 1.11.3.1463

      - name: Build uberjar
        working-directory: pine-lang
        run: clojure -T:build uber

      - uses: actions/upload-artifact@v4
        with:
          name: pine-standalone-jar
          path: pine-lang/target/pine-standalone.jar

  build-ui:
    needs: read-pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: beamlynx-desktop
      - uses: actions/checkout@v4
        with:
          repository: beamlynx/beamlynx-ui
          ref: ${{ needs.read-pins.outputs.ui_ref }}
          path: beamlynx-ui

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install beamlynx-ui deps
        working-directory: beamlynx-ui
        run: npm ci

      - name: Build UI export
        working-directory: beamlynx-desktop
        run: ./scripts/build-ui-export.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ui-export
          path: beamlynx-desktop/resources/ui

  package:
    needs: [read-pins, build-jar, build-ui]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: beamlynx-desktop
      - uses: actions/checkout@v4
        with:
          repository: beamlynx/pine-lang
          ref: ${{ needs.read-pins.outputs.pine_ref }}
          path: pine-lang

      - name: Download shared jar
        uses: actions/download-artifact@v4
        with:
          name: pine-standalone-jar
          path: pine-lang/target

      - name: Read pinned JDK version
        id: jdk
        shell: bash
        run: echo "version=$(grep -v '^#' pine-lang/desktop/JDK_VERSION | grep -v '^\s*$')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Build app-image for this OS/arch
        shell: bash
        working-directory: pine-lang
        run: ./desktop/build-app-image.sh

      - name: Download UI export
        uses: actions/download-artifact@v4
        with:
          name: ui-export
          path: beamlynx-desktop/resources/ui

      - name: Stage server
        shell: bash
        working-directory: beamlynx-desktop
        run: ./scripts/stage-server.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install beamlynx-desktop deps
        shell: bash
        working-directory: beamlynx-desktop
        run: npm ci

      - name: TypeScript build
        shell: bash
        working-directory: beamlynx-desktop
        run: npm run build

      - name: Package with electron-builder
        shell: bash
        working-directory: beamlynx-desktop
        # Always --publish=never here -- letting each OS in the matrix
        # publish directly to the same GitHub Release in parallel is racy:
        # electron-builder's GitHub publisher does a non-atomic
        # get-or-create-release + upload sequence, and concurrent runs from
        # independent jobs can clobber each other's uploads (confirmed: the
        # windows job's own log clearly showed it uploading its .exe, but
        # the release ended up missing it entirely). The publish-release
        # job below uploads everything from one place, sequentially,
        # instead.
        run: npx electron-builder --publish=never --config electron-builder.yml
        env:
          # Signing/notarization activate automatically based on which of
          # these are actually set -- harmless (build stays unsigned, as
          # today) until real secrets are added to the repo. See SIGNING.md
          # for what each secret is and how to obtain it.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: beamlynx-desktop-${{ matrix.os }}
          path: |
            beamlynx-desktop/release/*.AppImage
            beamlynx-desktop/release/*.deb
            beamlynx-desktop/release/*.dmg
            beamlynx-desktop/release/*.exe
            beamlynx-desktop/release/*.blockmap
            beamlynx-desktop/release/latest*.yml
          if-no-files-found: error

  publish-release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: beamlynx-desktop-*
          path: dist-artifacts
          merge-multiple: true

      - name: Create or update the GitHub Release, upload all assets sequentially
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          # find -print0 + xargs -0, not a bare glob -- artifactName is
          # fixed to avoid spaces now, but this is defense in depth against
          # word-splitting any filename that still contains one.
          find dist-artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
