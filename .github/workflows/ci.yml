name: CI

# Cheap build-validation on every push/PR: compiles, builds a Linux
# app-image + UI export, and runs electron-builder against an unpacked
# (`dir`) target -- no installer formats, no other OSes, no publish. Catches
# breakage immediately rather than only at release time. The full signed,
# multi-OS installer matrix lives in release.yml, triggered by a version tag.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The live database is shared by every released app, so a migration must
  # never break one. See supabase/README.md.
  #
  # This check is required to merge into main. It always runs, because a
  # required check that never reports blocks the PR for good. When nothing
  # about the database changed since main, it passes in seconds.
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did anything about the database change?
        id: changed
        run: |
          base=$(git merge-base origin/main HEAD)
          if git diff --quiet "$base" HEAD -- supabase scripts/check-supabase-migrations.js scripts/test-supabase-compat.sh .github/workflows/ci.yml; then
            echo "::notice::No database changes since main, so the database checks were skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '22'

      - name: Migrations only add
        if: steps.changed.outputs.run == 'true'
        run: node scripts/check-supabase-migrations.js

      - name: Start a local database with every migration
        if: steps.changed.outputs.run == 'true'
        run: npx -y supabase@2.120.0 db start

      - name: Released apps' calls still work
        if: steps.changed.outputs.run == 'true'
        run: ./scripts/test-supabase-compat.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beamlynx-desktop
        uses: actions/checkout@v4
        with:
          path: beamlynx-desktop

      - name: Read bundled version pins
        id: pins
        working-directory: beamlynx-desktop
        run: |
          echo "pine_ref=$(jq -r .pineLangRef bundled-versions.json)" >> "$GITHUB_OUTPUT"
          echo "ui_ref=$(jq -r .beamlynxUiRef bundled-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout pine-lang
        uses: actions/checkout@v4
        with:
          repository: beamlynx/pine-lang
          ref: ${{ steps.pins.outputs.pine_ref }}
          path: pine-lang

      - name: Checkout beamlynx-ui
        uses: actions/checkout@v4
        with:
          repository: beamlynx/beamlynx-ui
          ref: ${{ steps.pins.outputs.ui_ref }}
          path: beamlynx-ui

      - name: Read pinned JDK version
        id: jdk
        run: echo "version=$(grep -v '^#' pine-lang/desktop/JDK_VERSION | grep -v '^\s*$')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - uses: DeLaGuardo/setup-clojure@11.0
        with:
          cli: 1.11.3.1463

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build pine-lang app-image
        working-directory: pine-lang
        run: ./desktop/build-app-image.sh

      - name: Install beamlynx-ui deps
        working-directory: beamlynx-ui
        run: npm ci

      - name: Build UI export
        working-directory: beamlynx-desktop
        run: ./scripts/build-ui-export.sh

      - name: Stage server
        working-directory: beamlynx-desktop
        run: ./scripts/stage-server.sh

      - name: Stage Pine docs
        working-directory: beamlynx-desktop
        run: ./scripts/stage-docs.sh

      - name: Install beamlynx-desktop deps
        working-directory: beamlynx-desktop
        run: npm ci

      # The staged UI must load every font it ships, in Electron, from
      # file:// - how the packaged app loads it. A UI that bundles no fonts
      # fails too. See scripts/check-ui-fonts.js.
      - name: Check the UI's fonts load in Electron
        working-directory: beamlynx-desktop
        run: xvfb-run -a npx electron --no-sandbox scripts/check-ui-fonts.js ../beamlynx-ui

      - name: TypeScript build
        working-directory: beamlynx-desktop
        run: npm run build

      - name: electron-builder config sanity check (unpacked dir, no installer)
        working-directory: beamlynx-desktop
        run: npx electron-builder --linux dir --config electron-builder.yml

      - name: Check built-in SQLite in the packaged app
        working-directory: beamlynx-desktop
        run: ./scripts/check-builtin-sqlite.sh
