<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>beamlynx</title>
    <style>
      /* Colors matched to beamlynx-ui's dark theme (styles/colors.ts
         darkColors) so this doesn't visually flash-swap once the real UI
         loads. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #21252b;
        color: #abb2bf;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #4b5263;
        border-top-color: #61afef;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #abb2bf;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <p>Starting beamlynx server&hellip;</p>
  </body>
</html>
