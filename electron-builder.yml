appId: com.beamlynx.desktop
productName: beamlynx
directories:
  output: release
# NSIS's default artifact name template has a literal space
# ("beamlynx Setup 0.1.4.exe"), which broke an unquoted shell glob in the
# publish step (word-split into fragments) and got inconsistently
# sanitized on upload. No spaces, no ambiguity, consistent across targets.
artifactName: '${productName}-${version}.${ext}'

publish:
  provider: github
  owner: beamlynx
  repo: beamlynx-desktop
  # Match the plain X.Y.Z tag convention (see AGENTS.md) -- electron-builder
  # defaults to creating its own "v"-prefixed release tag, which would be a
  # second, redundant tag alongside the real one already pushed to trigger
  # this build.
  vPrefixedTagName: false
  # Publish directly instead of leaving a draft -- electron-updater's update
  # feed only sees published releases, not drafts.
  releaseType: release

files:
  - dist/**/*
  - assets/**/*
  - package.json

# Opt into the new static, FUSE-less AppImage runtime (electron-builder PR
# #9558) rather than the legacy runtime, which depends on the system having
# libfuse.so.2 (FUSE2) installed -- increasingly not the case by default on
# newer distros (Arch, Ubuntu 22.04+, Fedora, etc. dropped it), causing
# "dlopen(): error loading libfuse.so.2". Available since electron-builder
# 26.8.0 as an opt-in, becomes the v27 default -- opting in now avoids both
# the FUSE dependency and the risk of v27, which is still alpha-only.
toolsets:
  # 1.0.3, not the newer 1.1.0 -- electron-builder 26.15.7's schema only
  # accepts "0.0.0" | "1.0.2" | "1.0.3" for this version; 1.1.0 isn't in its
  # enum yet (verified against node_modules/app-builder-lib's own .d.ts).
  appimage: '1.0.3'

# Registers the beamlynx:// URL scheme -- auto-generates the Linux .desktop
# MimeType=x-scheme-handler/beamlynx; entry (deb only; a portable AppImage
# doesn't get desktop-file registration without appimaged/AppImageLauncher
# installed, so that target is a known gap, not handled here) and the macOS
# CFBundleURLTypes Info.plist entry. See src/main/index.ts's handleDeepLink
# and beamlynx-plans/pending/2026-08-15-mcp-server-and-url-scheme.md.
protocols:
  name: beamlynx
  schemes:
    - beamlynx

# Populated at build time by scripts/stage-server.sh and
# scripts/build-ui-export.sh -- lands under process.resourcesPath in the
# packaged app (see src/main/resources.ts).
extraResources:
  - from: resources/server
    to: server
  - from: resources/ui
    to: ui
  - from: resources/docs
    to: docs

linux:
  target:
    - AppImage
    - deb
  category: Development

# electron-updater's Linux AppImage updater replaces the running file
# in-place with the new version -- and specifically preserves the original
# filename only if artifactName has no ${version} in it (electron-builder
# added this deliberately, see electron-userland/electron-builder#2964).
# Without this override, a user who symlinks e.g. ~/bin/beamlynx ->
# beamlynx-0.1.5.AppImage finds the symlink dangling after the app updates
# itself to beamlynx-0.1.6.AppImage. Scoped to appImage only (not the top-
# level artifactName) -- .deb doesn't self-update via electron-updater at
# all (expected to go through apt instead), so a version in its filename
# doesn't have this problem.
appImage:
  artifactName: '${productName}.${ext}'

mac:
  target:
    - dmg
  category: public.app-category.developer-tools

win:
  target:
    - nsis
